<script>
'use strict';
const civilizations=[
{id:'egypt',name:'이집트',letter:'E',repo:'Egypt-Culture',color:'#65542f',tint:'#f2ecd9',wonders:['아부심벨','쿠푸왕의 피라미드','대스핑크스','호루스의 신전']},
